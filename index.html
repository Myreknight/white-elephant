<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Elephant Exchange</title>
  <meta name="description" content="Host a White Elephant gift exchange on the big screen: mystery boxes, dramatic reveals, steals and swaps.">
  <meta name="theme-color" content="#0d1714">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9"/><path d="M12 8v13"/><path d="M12 8c-1.5-3-5-4-6-2s2 2 6 2c4 0 7 0 6-2s-4.5-1-6 2"/></svg>
      <span id="brand-title">White Elephant</span>
    </div>
    <nav class="tabs" aria-label="Views">
      <button class="tab" data-action="view" data-id="setup" data-view-tab="setup">Setup</button>
      <button class="tab" data-action="view" data-id="play" data-view-tab="play">Play</button>
    </nav>
    <div class="top-actions">
      <button class="btn ghost sm" data-action="fullscreen" title="Fullscreen (for the big screen)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
        <span class="hide-sm">Fullscreen</span>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="modal-root"></div>
  <div id="announce-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript><p style="padding:24px">This app needs JavaScript turned on.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
